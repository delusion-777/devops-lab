
---
- name: Install Jenkins on the tradelive VM
  hosts: tradelive
  become: true
  gather_facts: true

  tasks:
    - name: Install Java 21 and required packages
      ansible.builtin.apt:
        name:
          - openjdk-21-jre
          - fontconfig
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create APT keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Jenkins repository signing key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: Add Jenkins LTS repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present
        update_cache: true

    - name: Install Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: true

    - name: Enable and start Jenkins service
      ansible.builtin.systemd:
        name: jenkins
        enabled: true
        state: started

    - name: Wait for Jenkins port 8080
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8080
        delay: 5
        timeout: 180

    - name: Wait for initial admin password file
      ansible.builtin.wait_for:
        path: /var/lib/jenkins/secrets/initialAdminPassword
        state: present
        timeout: 180

    - name: Read Jenkins initial admin password
      ansible.builtin.slurp:
        src: /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_password
      no_log: true

    - name: Display Jenkins initial admin password
      ansible.builtin.debug:
        msg: "Jenkins initial admin password: {{ jenkins_password.content | b64decode | trim }}"

